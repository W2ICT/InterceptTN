}
function randInt(min, max) {
  return Math.floor(rand(min, max + 1));
}
function pick(arr) {
  return arr[randInt(0, arr.length - 1)];
}
function roundTo(v, step) {
  return Math.round(v / step) * step;
}

/**
 * Classify a holding-pattern entry.
 * inboundCourse: published inbound course (deg, the course flown TOWARD the fix)
 * arrivalHeading: heading/track the aircraft is flying as it approaches the fix
 * turn: "right" (standard) | "left" (non-standard)
 * Returns { key: 'direct'|'teardrop'|'parallel', delta }
 *
 * Verified against the sector construction in ICAO Doc 8168 Vol I §6
 * (Direct 180°, Teardrop/Offset 70°, Parallel 110°) and cross-checked
 * numerically against a reference implementation (holdingentrycalculator.com).
 */
function classifyEntry(inboundCourse, arrivalHeading, turn) {
  const delta = norm360(arrivalHeading - inboundCourse);
  let key;
  if (turn === "right") {
    if (delta >= 290 || delta < 110) key = "direct";
    else if (delta < 180) key = "teardrop";
    else key = "parallel";
  } else {
    if (delta < 70 || delta >= 250) key = "direct";
    else if (delta <= 180) key = "parallel";
    else key = "teardrop";
  }
  return { key, delta };
}

const ENTRY_LABEL = {
  icao: { direct: "Sector 3 — Direct entry", teardrop: "Sector 2 — Offset entry", parallel: "Sector 1 — Parallel entry" },
  faa: { direct: "Direct entry", teardrop: "Teardrop entry", parallel: "Parallel entry" },
};

function entryDistanceToBoundary(delta, turn) {
  const bounds = turn === "right" ? [110, 180, 290, 360, 0] : [70, 180, 250, 360, 0];
  let min = 360;
  for (const b of bounds) {
    let d = Math.abs(delta - b);
    d = Math.min(d, 360 - d);
    if (d < min) min = d;
  }
  return min;
}

/** Given where the aircraft is (bearing/distance from a station) and the course
 * it must join, work out which side it's on and the heading to intercept it. */
function solveIntercept(bearingFromStation, establishedCourse, interceptAngle) {
  const delta = norm360(bearingFromStation - establishedCourse);
  const side = delta > 0 && delta < 180 ? "right" : "left";
  const interceptHeading = norm360(side === "right" ? establishedCourse - interceptAngle : establishedCourse + interceptAngle);
  return { side, interceptHeading, delta };
}

function navaidsUsableAsFix(airport) {
  const list = airport.navaids.filter((n) => n.type === "NDB" || n.type === "VOR/DME" || n.type === "TACAN");
  return list.length ? list : airport.navaids;
}

// DME arcs need a DME source — NDBs don't have one.
function navaidsUsableForArc(airport) {
  return airport.navaids.filter((n) => n.type === "VOR/DME" || n.type === "TACAN");
}

// Geometry of a DME-arc leg: entering the arc on `entryRadial` at `arcDme`, turning
// `turn` ("left"/"right") through `sweepDeg` to the exit radial at the same DME.
// Radial increasing (clockwise as seen on a map) = a right-hand arc (station kept on
// the aircraft's right, continuous right turns); decreasing = left-hand.
function computeArcFix(stationPos, entryRadial, arcDme, turn, sweepDeg) {
  const signedSweep = turn === "right" ? sweepDeg : -sweepDeg;
  const exitRadial = norm360(entryRadial + signedSweep);
  const midRadial = norm360(entryRadial + signedSweep / 2);
  const exitPos = destPoint(stationPos, exitRadial, arcDme);
  const midPos = destPoint(stationPos, midRadial, arcDme);
  const headingAtExit = norm360(exitRadial + (turn === "right" ? 90 : -90));
  return { exitRadial, exitPos, midPos, headingAtExit };
}

// Build the exact per-leg-kind sequence for a sortie (counts, not chance), then
// shuffle so the types are mixed through the sortie rather than grouped together.
function buildLegKinds(legCount, fixToFixCount, dmeArcCount, holdingCount) {
  const ftf = Math.max(0, Math.min(fixToFixCount || 0, legCount));
  const arc = Math.max(0, Math.min(dmeArcCount || 0, legCount - ftf));
  const hold = Math.max(0, Math.min(holdingCount || 0, legCount - ftf - arc));
  const intercept = legCount - ftf - arc - hold;
  const kinds = [
    ...Array(ftf).fill("fixToFix"),
    ...Array(arc).fill("dmeArc"),
    ...Array(hold).fill("hold"),
    ...Array(intercept).fill("intercept"),
  ];
  for (let i = kinds.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [kinds[i], kinds[j]] = [kinds[j], kinds[i]];
  }
  return kinds;
}

/** Resolve an airport's briefed training-area boundary/areas into real lat/lon
 * polygons (radial/DME are given relative to a named reference navaid, "CTR"). */
function computeTrainingAreaPolygons(airport) {
  const ta = airport.trainingArea;
  if (!ta) return null;
  const station = airport.navaids.find((n) => n.id === ta.refNavaidId);
  if (!station) return null;
  const pts = { CTR: station.pos };
  Object.keys(ta.points).forEach((k) => {
    const p = ta.points[k];
    pts[k] = destPoint(station.pos, p.radial, p.dme);
  });
  const areas = {};
  Object.keys(ta.areas).forEach((k) => { areas[k] = ta.areas[k].map((name) => pts[name]); });
  const boundary = ta.boundary.map((name) => pts[name]);
  return { refStation: station, points: pts, areas, boundary };
}

/** Uniformly-ish sample a lat/lon point inside one of the given polygons
 * (rejection sampling against each polygon's bounding box). */
// True if `pt` falls inside ANY of the given polygons — used to confirm a leg's
// whole path stays within the union of the SELECTED training sub-area(s), not just
// somewhere inside the overall outer boundary (which would let it cut through an
// unselected sub-area).
function pointInAnyPolygon(pt, polys) {
  return polys.some((poly) => pointInPolygon(pt, poly));
}

function samplePointInPolygons(polys) {
  for (let tries = 0; tries < 400; tries++) {
    const poly = pick(polys);
    const lats = poly.map((p) => p.lat), lons = poly.map((p) => p.lon);
    const cand = { lat: rand(Math.min(...lats), Math.max(...lats)), lon: rand(Math.min(...lons), Math.max(...lons)) };
    if (pointInPolygon(cand, poly)) return cand;
  }
  return null;
}

/* ---------------- Flight-profile (sortie) generator ---------------- */

// Navaids a Holding leg can be flown against: the departure airport's (and the
// second station's, in dual mode) NDB / VOR-DME / TACAN. Key = "ICAO|index".
function holdRefOptions(depIcao, secondIcao, dual) {
  const out = [];
  [depIcao, dual ? secondIcao : null].forEach((icao) => {
    const airport = AIRPORTS[icao];
    if (!airport || out.some((o) => o.airport === airport)) return;
    navaidsUsableAsFix(airport).forEach((navaid) => {
      out.push({ key: icao + "|" + airport.navaids.indexOf(navaid), airport, navaid });
    });
  });
  return out;
}

// Default preference when nothing is picked: TACAN, then VOR/DME, then whatever is left.
function defaultHoldRef(options) {
  return options.find((o) => o.navaid.type === "TACAN") || options.find((o) => o.navaid.type === "VOR/DME") || options[0];
}

// Station every Holding leg is flown against — the instructor's choice (config.holdRefKey).
function holdRef(config, dep) {
  const options = holdRefOptions(config.departureIcao, config.secondIcao, config.stationMode === "dual");
  return options.find((o) => o.key === config.holdRefKey) || defaultHoldRef(options) || { airport: dep, navaid: dep.navaids[0] };
}

function generateFlightProfile(config) {
  const dep = AIRPORTS[config.departureIcao];
  const pool = [];
  navaidsUsableAsFix(dep).forEach((n) => pool.push({ airport: dep, navaid: n }));
  const arcPool = [];
  navaidsUsableForArc(dep).forEach((n) => arcPool.push({ airport: dep, navaid: n }));
  if (config.stationMode === "dual" && config.secondIcao && AIRPORTS[config.secondIcao]) {
    const second = AIRPORTS[config.secondIcao];
    navaidsUsableAsFix(second).forEach((n) => pool.push({ airport: second, navaid: n }));
    navaidsUsableForArc(second).forEach((n) => arcPool.push({ airport: second, navaid: n }));
  }

  const courseStep = config.difficulty === "easy" ? 30 : config.difficulty === "medium" ? 10 : 1;
  const interceptAngle = config.interceptAngle || 45;
  // Optional training ring: every fix must sit between ring.minNm and ring.maxNm of the departure ARP.
  const ring = config.ring;
  const inRing = (p) => {
    if (!ring) return true;
    const d = bearingDistance(dep.arp, p).distNm;
    return d >= ring.minNm && d <= ring.maxNm;
  };
  // Training altitude is restricted to 1000-5500 ft AGL, in 500ft steps.
  const altitude = randInt(2, 11) * 500;

  let currentPos = { lat: dep.arp.lat, lon: dep.arp.lon };
  const legs = [];
  const legKinds = buildLegKinds(config.legCount, config.fixToFixCount, config.dmeArcCount, config.holdingLegCount);
  for (let i = 0; i < config.legCount; i++) {
    // DME arcs need a DME-capable station; fall back to a plain intercept leg if this
    // airport/station-mode combo has none (e.g. an NDB-only field).
    const wantArc = legKinds[i] === "dmeArc" && arcPool.length > 0;
    let kind = legKinds[i] === "dmeArc" && !wantArc ? "intercept" : legKinds[i];
    // Holding is flown against the navaid chosen in the Holding reference selector.
    const ref = kind === "hold" ? holdRef(config, dep) : pick(wantArc ? arcPool : pool);
    const station = ref.navaid;

    // If this station's airport has a briefed training area and the instructor
    // picked which sub-area(s) to use, sample the fix from inside those areas
    // instead of a fully random radial/DME.
    let course, dme, fixPos, arcExtra;
    const taPolys = computeTrainingAreaPolygons(ref.airport);
    const selectedPolys = (taPolys && config.trainingAreas && config.trainingAreas.length)
      ? config.trainingAreas.map((k) => taPolys.areas[k]).filter(Boolean) : [];
    // The real departure airport can sit a hair outside the training-area polygon
    // (its CTR vertex is the reference navaid's exact position, not the ARP) — every
    // sortie is forced to start there regardless, so on the very first leg don't
    // require the intercept-join point to be in-area too, only the fix itself (and,
    // for an arc, its exit/mid points). From leg 2 on, currentPos is always a fix we
    // chose ourselves and this never applies.
    const startInArea = !selectedPolys.length || pointInAnyPolygon(currentPos, selectedPolys);
    if (selectedPolys.length) {
      // Sampling only constrains the FIX (leg endpoint) to be inside the SELECTED
      // sub-area(s) — the intercept turn (or, for fix-to-fix/dme-arc, the rest of
      // the leg's path) leading up to it could still cut through an unselected
      // sub-area on the way, even while staying inside the overall outer boundary.
      // Retry candidates until every point checked below falls inside the union of
      // the selected sub-area(s) specifically, not just the training area at large.
      for (let tries = 0; tries < 60 && course === undefined; tries++) {
        const point = samplePointInPolygons(selectedPolys);
        if (!point) break;
        const bd = bearingDistance(station.pos, point);
        const cCourse = Math.round(bd.bearing);
        const cDme = Math.round(bd.distNm * 10) / 10;
        const cFixPos = destPoint(station.pos, cCourse, cDme);
        let ok, extra;
        if (kind === "fixToFix") {
          const mid = { lat: (currentPos.lat + cFixPos.lat) / 2, lon: (currentPos.lon + cFixPos.lon) / 2 };
          ok = inRing(cFixPos) && pointInAnyPolygon(cFixPos, selectedPolys) && (!startInArea || pointInAnyPolygon(mid, selectedPolys));
        } else if (kind === "dmeArc") {
          const turn = pick(["left", "right"]);
          const sweepDeg = roundTo(rand(20, 70), 10);
          extra = computeArcFix(station.pos, cCourse, cDme, turn, sweepDeg);
          extra.turn = turn; extra.sweepDeg = sweepDeg;
          const curBearing = bearingDistance(station.pos, currentPos).bearing;
          const cInterceptHeading = solveIntercept(curBearing, cCourse, interceptAngle).interceptHeading;
          const interceptPt = intersectCourses(currentPos, cInterceptHeading, station.pos, cCourse);
          ok = interceptPt && (!startInArea || pointInAnyPolygon(interceptPt, selectedPolys))
            && pointInAnyPolygon(cFixPos, selectedPolys) && inRing(extra.exitPos) && inRing(extra.midPos)
            && pointInAnyPolygon(extra.exitPos, selectedPolys)
            && pointInAnyPolygon(extra.midPos, selectedPolys);
        } else {
          const curBearing = bearingDistance(station.pos, currentPos).bearing;
          const cInterceptHeading = solveIntercept(curBearing, cCourse, interceptAngle).interceptHeading;
          const interceptPt = intersectCourses(currentPos, cInterceptHeading, station.pos, cCourse);
          ok = interceptPt && (!startInArea || pointInAnyPolygon(interceptPt, selectedPolys)) && pointInAnyPolygon(cFixPos, selectedPolys) && inRing(cFixPos);
        }
        if (ok) { course = cCourse; dme = cDme; fixPos = kind === "dmeArc" ? extra.exitPos : cFixPos; arcExtra = extra; }
      }
      // The full-complexity search above can genuinely have no solution (e.g. a
      // wide arc sweep or steep intercept angle just doesn't fit inside a small
      // sub-area, no matter how many times you retry). Rather than ever falling
      // through to a fully unconstrained leg that could leave the selected area,
      // downgrade to the simplest leg shape — direct fix-to-fix, which only needs
      // the fix and its midpoint in-area — and retry against that instead.
      if (course === undefined) {
        for (let tries = 0; tries < 100 && course === undefined; tries++) {
          const point = samplePointInPolygons(selectedPolys);
          if (!point) break;
          const bd = bearingDistance(station.pos, point);
          const cCourse = Math.round(bd.bearing);
          const cDme = Math.round(bd.distNm * 10) / 10;
          const cFixPos = destPoint(station.pos, cCourse, cDme);
          const mid = { lat: (currentPos.lat + cFixPos.lat) / 2, lon: (currentPos.lon + cFixPos.lon) / 2 };
          if (inRing(cFixPos) && pointInAnyPolygon(cFixPos, selectedPolys) && (!startInArea || pointInAnyPolygon(mid, selectedPolys))) {
            course = cCourse; dme = cDme; fixPos = cFixPos; kind = "fixToFix"; arcExtra = undefined;
          }
        }
      }
    }
    if (course === undefined && selectedPolys.length) {
      // Both validated tiers above failed to find any compliant candidate (can
      // happen for a very small/thin sub-area) — this is the bulletproof floor:
      // take any point straight out of the selected area(s), no further path
      // validation. The fix is still guaranteed in-area even if this particular
      // leg's join isn't as clean as usual.
      let point = samplePointInPolygons(selectedPolys);
      for (let t = 0; point && ring && t < 60 && !inRing(point); t++) point = samplePointInPolygons(selectedPolys);
      if (point) {
        const bd = bearingDistance(station.pos, point);
        course = Math.round(bd.bearing);
        dme = Math.round(bd.distNm * 10) / 10;
        fixPos = destPoint(station.pos, course, dme);
        kind = "fixToFix";
        arcExtra = undefined;
      }
    }
    if (course === undefined) {
      // With a training ring, retry random candidates until the fix (and, for an arc,
      // its midpoint) lands inside the ring; otherwise the first candidate stands.
      for (let tries = 0; tries < (ring ? 300 : 1); tries++) {
        course = roundTo(randInt(0, 359), courseStep) % 360 || (courseStep === 30 ? 360 : 0);
        dme = roundTo(rand(6, 25), 1);
        if (kind === "dmeArc") {
          const turn = pick(["left", "right"]);
          const sweepDeg = roundTo(rand(20, 70), 10);
          arcExtra = computeArcFix(station.pos, course, dme, turn, sweepDeg);
          arcExtra.turn = turn; arcExtra.sweepDeg = sweepDeg;
          fixPos = arcExtra.exitPos;
          if (inRing(fixPos) && inRing(arcExtra.midPos)) break;
        } else {
          fixPos = destPoint(station.pos, course, dme);
          if (inRing(fixPos)) break;
        }
      }
    }

    if (kind === "fixToFix") {
      const { bearing: directCourse, distNm: directDistNm } = bearingDistance(currentPos, fixPos);
      legs.push({
        index: i + 1,
        kind: "fixToFix",
        stationAirport: ref.airport,
        station,
        course,
        dme,
        fromPos: currentPos,
        directCourse: Math.round(directCourse),
        directDistNm: Math.round(directDistNm * 10) / 10,
        fixPos,
        headingAtFix: Math.round(directCourse),
      });
    } else if (kind === "dmeArc") {
      // bearingFromStation = the radial the aircraft is currently on, i.e. bearing FROM
      // the station TO the aircraft's current position (not the reciprocal).
      const { bearing, distNm } = bearingDistance(station.pos, currentPos);
      const { side, interceptHeading } = solveIntercept(bearing, course, interceptAngle);
      legs.push({
        index: i + 1,
        kind: "dmeArc",
        stationAirport: ref.airport,
        station,
        course, // entry radial
        dme,    // arc DME
        exitRadial: arcExtra.exitRadial,
        turn: arcExtra.turn,
        sweepDeg: arcExtra.sweepDeg,
        fromPos: currentPos,
        bearingFromStation: Math.round(bearing * 10) / 10,
        distanceNm: Math.round(distNm * 10) / 10,
        side,
        interceptAngle,
        interceptHeading: Math.round(interceptHeading),
        fixPos,
        headingAtFix: Math.round(arcExtra.headingAtExit),
      });
    } else if (kind === "hold") {
      // Join the fix exactly like a plain intercept leg, then hold there — a
      // self-contained holding exercise at its own location, distinct from any
      // final "Ending: Hold" (which is a separate thing that happens after all
      // legs, possibly at yet another fix).
      // The hold sits on radial `course` of the chosen reference navaid, inbound TO the station:
      // inbound course = radial + 180. The aircraft flies direct to the fix, so the
      // arrival heading (and therefore the entry sector) depends on where it comes from.
      const { bearing, distNm } = bearingDistance(station.pos, currentPos);
      const { bearing: directBrg, distNm: directDist } = bearingDistance(currentPos, fixPos);
      const arrivalHeading = Math.round(directBrg) % 360;
      const inboundCourse = norm360(course + 180) || 360;
      const holdTurn = config.turnMode === "mixed" ? pick(["right", "right", "right", "left"]) : config.turnMode;
      const entry = classifyEntry(inboundCourse, arrivalHeading, holdTurn);
      legs.push({
        index: i + 1,
        kind: "hold",
        stationAirport: ref.airport,
        station,
        course,
        dme,
        fromPos: currentPos,
        bearingFromStation: Math.round(bearing * 10) / 10,
        distanceNm: Math.round(distNm * 10) / 10,
        directCourse: arrivalHeading,
        directDistNm: Math.round(directDist * 10) / 10,
        fixPos,
        inboundCourse,
        turn: holdTurn,
        entry,
        holdLeg: { kind: "time", value: 1 },
        marginToBoundary: entryDistanceToBoundary(norm360(arrivalHeading - inboundCourse), holdTurn),
        headingAtFix: inboundCourse,
      });
    } else {
      // bearingFromStation = the radial the aircraft is currently on, i.e. bearing FROM
      // the station TO the aircraft's current position (not the reciprocal).
      const { bearing, distNm } = bearingDistance(station.pos, currentPos);
      const { side, interceptHeading } = solveIntercept(bearing, course, interceptAngle);
      legs.push({
        index: i + 1,
        kind: "intercept",
        stationAirport: ref.airport,
        station,
        course,
        dme,
        fromPos: currentPos,
        bearingFromStation: Math.round(bearing * 10) / 10,
        distanceNm: Math.round(distNm * 10) / 10,
        side,
        interceptAngle,
        interceptHeading: Math.round(interceptHeading),
        fixPos,
        headingAtFix: course,
      });
    }
    currentPos = fixPos;
  }

  const ending = { type: "plain", atPos: currentPos };

  return { departure: dep, legs, ending, altitude, config, id: 0 };
}

// A holding fix briefed right on top of the departure airport isn't a realistic
// training scenario — regenerate the whole profile (cheap, since it's pure random
// generation) until the hold ends up at least this far from the departure ARP.
const MIN_HOLD_DIST_FROM_DEP_NM = 8;

function holdLegsFarEnoughFromDeparture(profile) {
  return profile.legs
    .filter((l) => l.kind === "hold")
    .every((l) => bearingDistance(profile.departure.arp, l.fixPos).distNm >= MIN_HOLD_DIST_FROM_DEP_NM);
}

function holdEntriesClear(profile) {
  return profile.legs.filter((l) => l.kind === "hold").every((l) => l.marginToBoundary >= 5);
}

function legsInsideRing(profile) {
  const ring = profile.config.ring;
  if (!ring) return true;
  return profile.legs.every((l) => {
    const d = bearingDistance(profile.departure.arp, l.fixPos).distNm;
    return d >= ring.minNm && d <= ring.maxNm;
  });
}

function generateFlightProfileValidated(config) {
  let profile = generateFlightProfile(config);
  for (let tries = 0; tries < 50 && !(holdLegsFarEnoughFromDeparture(profile) && legsInsideRing(profile) && holdEntriesClear(profile)); tries++) {
    profile = generateFlightProfile(config);
  }
  return profile;
}

function generateProfiles(config, count) {
  const list = [];
  for (let i = 0; i < count; i++) {
    const p = generateFlightProfileValidated(config);
    p.id = i + 1;
    list.push(p);
  }
  return list;
}

/* ============================================================
 * geometry.js — Pure geometry for a flight profile, NO
 * rendering here. Everything is computed in a local flat-earth
 * NM plane (x = east, y = north, real nautical miles) anchored
 * at the departure airport, then callers convert points to
 * lat/lon (fromNM, for the map / KML / GPX) as needed. This is
 * the single source of truth shared by map.js and export.js so
 * the picture on the map always matches the coordinates in the
 * exported files.
 * ============================================================ */

function polarNM(origin, bearingDeg, dist) {
  const r = (bearingDeg * Math.PI) / 180;
  return { x: origin.x + dist * Math.sin(r), y: origin.y + dist * Math.cos(r) };
}
function arcPointsNM(center, radius, startBearing, sweepSigned, steps) {
  steps = steps || 24;
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    pts.push(polarNM(center, startBearing + sweepSigned * t, radius));
  }
  return pts;
}
function lineIntersect(p, dirDeg, a, aDirDeg) {
  const dr = (dirDeg * Math.PI) / 180, ar = (aDirDeg * Math.PI) / 180;
  const d = { x: Math.sin(dr), y: Math.cos(dr) };
  const ad = { x: Math.sin(ar), y: Math.cos(ar) };
  const denom = d.x * -ad.y - d.y * -ad.x;
  if (Math.abs(denom) < 1e-9) return null;
  const rhsX = a.x - p.x, rhsY = a.y - p.y;
  const t = (rhsX * -ad.y - rhsY * -ad.x) / denom;
  if (t < 0) return null;
  return { x: p.x + d.x * t, y: p.y + d.y * t };
}

// Assumed holding airspeed for time-based legs and turn radius — this is a
// helicopter/training-aircraft tool, holding speed is briefed around 80-100 KIAS,
// so 90 KIAS (the midpoint) stands in since no real airspeed is modelled elsewhere.
const HOLD_IAS_KT = 90;

/** Fly an entry path as a polyline: straight leg, then a standard-rate turn of
 * radius r until the aircraft can intercept the inbound course (line through F,
 * heading IC) at 30-45° before reaching F, then straight to the intercept point and
 * on to F. dir = +1 right turn, -1 left turn. */
function holdEntryPath(F, IC, O, s, L, r, key) {
  const pts = [F];
  let pos, hdg, dir;
  if (key === "parallel") {
    hdg = O; dir = -s;
  } else {
    hdg = norm360(O - s * 30); dir = s;
  }
  pos = polarNM(F, hdg, L);
  pts.push(pos);
  const center = polarNM(pos, hdg + dir * 90, r);
  const startB = norm360(hdg + dir * 90 + 180);
  let swept = 0, hit = null;
  for (swept = 10; swept <= 300; swept += 1) {
    const h = norm360(hdg + dir * swept);
    const here = polarNM(center, startB + dir * swept, r);
    const crossAng = Math.abs(((h - IC + 540) % 360) - 180);
    if (crossAng >= 30 && crossAng <= 60) {
      const P = lineIntersect(here, h, F, IC);
      const along = P ? (P.x - F.x) * Math.sin((IC * Math.PI) / 180) + (P.y - F.y) * Math.cos((IC * Math.PI) / 180) : 1;
      if (P && along < -0.2) { hit = { here, P, swept }; break; }
    }
  }
  if (!hit) {
    hit = { swept: 180, here: polarNM(center, startB + dir * 180, r), P: null };
  }
  pts.push(...arcPointsNM(center, r, startB, dir * hit.swept, Math.max(6, Math.ceil(hit.swept / 10))));
  if (hit.P) pts.push(hit.P);
  pts.push(F);
  return pts;
}

/** Racetrack (holding pattern) outline + entry-maneuver kink, in NM-plane,
 * anchored at `atNM` (the fix). The outbound leg is drawn to scale from the
 * actual briefed leg (DME leg: that many NM; time leg: minutes converted via
 * HOLD_IAS_KT). Turn radius comes from a standard-rate (3°/sec, 2 min/360°)
 * turn at HOLD_IAS_KT — r(NM) = V(kt) / 188.5 — instead of the departure's
 * outbound leg length, since radius only depends on speed and turn rate. */
function computeRacetrackXY(atNM, ending) {
  const IC = ending.inboundCourse;
  const O = norm360(IC + 180);
  const turn = ending.turn;
  const turnSide = turn === "right" ? 90 : -90;
  const sweep = turn === "right" ? 180 : -180;
  const L = ending.leg.kind === "dme" ? ending.leg.value : ending.leg.value * (HOLD_IAS_KT / 60);
  const r = HOLD_IAS_KT / 188.5;

  const F = atNM;
  const A = polarNM(F, O, L);
  const C1 = polarNM(F, IC + turnSide, r);
  const F2 = { x: 2 * C1.x - F.x, y: 2 * C1.y - F.y };
  const B = polarNM(F2, O, L);
  const C2 = polarNM(B, O + turnSide, r);
  const arc1 = arcPointsNM(C1, r, norm360(IC + turnSide + 180), sweep);
  const arc2 = arcPointsNM(C2, r, norm360(O + turnSide + 180), sweep);
  const loop = [A, ...arc1, B, ...arc2.slice(1)];

  // Entry maneuver (FAA/ICAO standard), drawn as flown at standard-rate turns:
  //  - Direct: no extra maneuver — just turn outbound at the fix.
  //  - Parallel (Sector 1): cross the fix, fly outbound heading O for the leg length,
  //    turn AGAINST the pattern direction (toward the holding side) until able to
  //    intercept the inbound course, then return to the fix.
  //  - Teardrop / Offset (Sector 2): cross the fix, fly outbound 30° off O toward the
  //    holding side for the leg length, turn IN the pattern direction to intercept
  //    the inbound course, then return to the fix.
  const s = turn === "right" ? 1 : -1;
  const kink = ending.entry.key === "direct" ? null : holdEntryPath(F, IC, O, s, L, r, ending.entry.key);
  return { F, A, B, loop, kink };
}

/**
 * Compute every point of a flight profile in the local NM plane.
 * Returns { origin, toNM, toLL, depXY, legs:[{leg, stationXY, fixXY, fromXY, interceptXY}], ending }
 */
function computeProfileGeometry(profile) {
  const origin = profile.departure.arp;
  const originLatRad = (origin.lat * Math.PI) / 180;
  const toNM = (latlon) => ({
    x: (latlon.lon - origin.lon) * 60 * Math.cos(originLatRad),
    y: (latlon.lat - origin.lat) * 60,
  });
  const toLL = (pt) => fromNM(origin, pt);

  const depXY = { x: 0, y: 0 };
  const legs = profile.legs.map((leg) => ({ leg, stationXY: toNM(leg.station.pos), fixXY: toNM(leg.fixPos) }));

  let prevXY = depXY;
  legs.forEach((L) => {
    L.fromXY = prevXY;
    if (L.leg.kind === "fixToFix") {
      // No intercept maneuver — the whole leg is one direct segment from the
      // previous fix, so collapse the intercept point onto it.
      L.interceptXY = L.fromXY;
    } else if (L.leg.kind === "dmeArc") {
      L.interceptXY = lineIntersect(prevXY, L.leg.interceptHeading, L.stationXY, L.leg.course) || L.fixXY;
      const sweepSigned = L.leg.turn === "right" ? L.leg.sweepDeg : -L.leg.sweepDeg;
      L.arcPts = arcPointsNM(L.stationXY, L.leg.dme, L.leg.course, sweepSigned, 24);
    } else if (L.leg.kind === "hold") {
      L.interceptXY = L.fromXY; // direct to the holding fix, no radial intercept
      L.racetrack = computeRacetrackXY(L.fixXY, { inboundCourse: L.leg.inboundCourse, turn: L.leg.turn, entry: L.leg.entry, leg: L.leg.holdLeg });
    } else {
      L.interceptXY = lineIntersect(prevXY, L.leg.interceptHeading, L.stationXY, L.leg.course) || L.fixXY;
    }
    prevXY = L.fixXY;
  });

  const ending = { type: profile.ending.type, fromXY: prevXY };

  return { origin, toNM, toLL, depXY, legs, ending };
}

function pad3(n) {
  return Math.round(n).toString().padStart(3, "0");
}

/* ============================================================
 * map.js — Real GIS map rendering of a flight profile, using
 * Leaflet + Esri tiles. Pulls all coordinates from geometry.js's
 * computeProfileGeometry() so the map always matches the
 * KML/GPX export exactly.
 * ============================================================ */

function llArr(ll) { return [ll.lat, ll.lon]; }

async function renderProfileMap(container, profile) {
  const geo = computeProfileGeometry(profile);
  const map = L.map(container, { scrollWheelZoom: true, zoomControl: false });
  L.control.zoom({ position: "bottomright" }).addTo(map);

  // Free basemap only — no API key/billing account needed, unlike Google's tile API.
  // Esri's World_Imagery only has z19 native resolution over developed/urban areas;
  // rural regions (like most of these training areas) serve a literal "Map data not
  // yet available" placeholder tile past their real coverage. maxNativeZoom caps real
  // tile requests at a level Esri reliably has everywhere, and Leaflet upscales the
  // last good tile for zoom beyond that instead of ever fetching the placeholder.
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19,
    maxNativeZoom: 16,
    attribution: "Tiles &copy; Esri",
  }).addTo(map);
  addLegend(map);

  const bounds = [];
  const addBounds = (ll) => bounds.push(llArr(ll));

  // Symbology (kept consistent with the on-map legend, see addLegend()):
  //   amber dashed  = maneuvering to intercept a course (not yet established)
  //   navy solid    = established, tracking a course / holding pattern
  //   numbered pin  = a fix/waypoint, in the order the sortie visits it
  const INTERCEPT_STYLE = { color: "#e0a02c", weight: 3, dashArray: "7 6" };
  const TRACK_STYLE = { color: "#1d4f91", weight: 4 };

  const navIcon = L.divIcon({ className: "navaid-marker", html: '<div class="pin pin-nav" title="Navaid"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
  const depIcon = L.divIcon({ className: "dep-marker", html: '<div class="pin pin-dep">&#9992;</div>', iconSize: [24, 24], iconAnchor: [12, 12] });
  const fixIcon = (n) => L.divIcon({ className: "fix-marker", html: `<div class="pin pin-fix">${n}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
  const holdIcon = L.divIcon({ className: "fix-marker", html: '<div class="pin pin-hold">H</div>', iconSize: [22, 22], iconAnchor: [11, 11] });

  // Departure
  const depLL = geo.origin;
  addBounds(depLL);
  L.marker(llArr(depLL), { icon: depIcon }).addTo(map).bindTooltip(`Takeoff — ${profile.departure.icao}`, { direction: "top" });

  // Stations (dedup)
  const drawnStations = new Set();
  function ensureStation(xy, navaid) {
    const key = (navaid.id || "") + navaid.type + navaid.freq;
    if (drawnStations.has(key)) return;
    drawnStations.add(key);
    const ll = geo.toLL(xy);
    addBounds(ll);
    L.marker(llArr(ll), { icon: navIcon }).addTo(map).bindTooltip(
      `${navaid.id || navaid.type} — ${navaid.type}${navaid.freq ? " " + navaid.freq : ""}${navaid.chan ? " / " + navaid.chan : ""}`
    );
  }

  // Legs
  geo.legs.forEach((L_, i) => {
    ensureStation(L_.stationXY, L_.leg.station);
    const fromLL = geo.toLL(L_.fromXY);
    const interceptLL = geo.toLL(L_.interceptXY);
    const fixLL = geo.toLL(L_.fixXY);
    addBounds(fixLL);
    if (L_.leg.kind === "fixToFix") {
      L.polyline([llArr(fromLL), llArr(fixLL)], TRACK_STYLE).addTo(map)
        .bindTooltip(`Direct ${pad3(L_.leg.directCourse)}° / ${L_.leg.directDistNm} NM`, { sticky: true });
    } else if (L_.leg.kind === "dmeArc") {
      L.polyline([llArr(fromLL), llArr(interceptLL)], INTERCEPT_STYLE).addTo(map);
      const arcLLObjs = L_.arcPts.map((p) => geo.toLL(p));
      arcLLObjs.forEach(addBounds);
      L.polyline(arcLLObjs.map(llArr), TRACK_STYLE).addTo(map)
        .bindTooltip(`${L_.leg.dme} DME arc, ${L_.leg.turn.toUpperCase()} turn, R${pad3(L_.leg.course)}° → R${pad3(L_.leg.exitRadial)}°`, { sticky: true });
    } else if (L_.leg.kind === "hold") {
      L.polyline([llArr(fromLL), llArr(fixLL)], TRACK_STYLE).addTo(map)
        .bindTooltip(`Direct ${pad3(L_.leg.directCourse)}° / ${L_.leg.directDistNm} NM to hold fix`, { sticky: true });
      const rt = L_.racetrack;
      const loopPts = rt.loop.map((p) => geo.toLL(p));
      loopPts.forEach(addBounds);
      L.polyline(loopPts.map(llArr), TRACK_STYLE).addTo(map);
      if (rt.kink) L.polyline(rt.kink.map((p) => llArr(geo.toLL(p))), INTERCEPT_STYLE).addTo(map);
    } else {
      L.polyline([llArr(fromLL), llArr(interceptLL)], INTERCEPT_STYLE).addTo(map);
      L.polyline([llArr(interceptLL), llArr(fixLL)], TRACK_STYLE).addTo(map)
        .bindTooltip(`Track ${pad3(L_.leg.course)}° to ${L_.leg.dme} DME`, { sticky: true });
    }
    let fixDesc, fixMarkerIcon = fixIcon(i + 1);
    if (L_.leg.kind === "dmeArc") {
      fixDesc = `FIX ${i + 1} — R${pad3(L_.leg.exitRadial)}°/${L_.leg.dme} DME from ${L_.leg.station.id || L_.leg.station.type} (arc exit)`;
    } else if (L_.leg.kind === "hold") {
      fixDesc = `FIX ${i + 1} — Hold at ${L_.leg.station.id || L_.leg.station.type}, inbound ${pad3(L_.leg.inboundCourse)}°, ${L_.leg.turn} turns`;
      fixMarkerIcon = holdIcon;
    } else {
      fixDesc = `FIX ${i + 1} — R${pad3(L_.leg.course)}°/${L_.leg.dme} DME from ${L_.leg.station.id || L_.leg.station.type}`;
    }
    L.marker(llArr(fixLL), { icon: fixMarkerIcon }).addTo(map).bindTooltip(fixDesc);
  });

  // Training-area overlay (VTBL etc.) — drawn last, under everything visually but
  // added after so it can still be toggled; low-key styling keeps it out of the way.
  drawTrainingAreaOverlay(map, profile);

  // Training ring (min/max NM from the departure ARP), if the instructor enabled one.
  if (profile.config.ring) {
    const c = [profile.departure.arp.lat, profile.departure.arp.lon];
    [profile.config.ring.minNm, profile.config.ring.maxNm].forEach((nm) => {
      L.circle(c, { radius: nm * 1852, color: "#3ecfab", weight: 1.5, dashArray: "6 6", opacity: .8, fill: false, interactive: false })
        .addTo(map).bindTooltip(`${nm} NM from ${profile.departure.icao}`, { sticky: true });
    });
    const r = profile.config.ring.maxNm / 60;
    addBounds({ lat: profile.departure.arp.lat + r, lon: profile.departure.arp.lon });
    addBounds({ lat: profile.departure.arp.lat - r, lon: profile.departure.arp.lon });
  }

  if (bounds.length) map.fitBounds(bounds, { paddingTopLeft: [350, 60], paddingBottomRight: [420, 40] });
  return map;
}

/* Draw the briefed local training-area boundary (if the departure or any station
 * airport has one) as a low-key reference overlay: one clean outer boundary line,
 * plus a borderless fill wash over just the sub-area(s) this sortie actually used
 * (their edges share the CTR vertex, so stroking every one of them at once drew a
 * tangle of overlapping lines through the middle — fill-only avoids that). */
function drawTrainingAreaOverlay(map, profile) {
  const airports = new Set([profile.departure, ...profile.legs.map((l) => l.stationAirport).filter(Boolean)]);
  const usedKeys = new Set(profile.config.trainingAreas || []);
  airports.forEach((airport) => {
    const polys = computeTrainingAreaPolygons(airport);
    if (!polys) return;
    L.polyline(polys.boundary.map(llArr), { color: "#8b96a8", weight: 2, dashArray: "4 5", opacity: .8 }).addTo(map);
    Object.keys(polys.areas).forEach((key) => {
      if (usedKeys.size && !usedKeys.has(key)) return;
      const ring = polys.areas[key].map(llArr);
      const poly = L.polygon(ring, { stroke: false, fillColor: "#3ecfab", fillOpacity: .08 }).addTo(map);
      poly.bindTooltip(key.replace("area", "Area "), { sticky: true });
    });
  });
}

/* Small fixed legend explaining the line/marker symbology used on the map. */
function addLegend(map) {
  const legend = L.control({ position: "bottomleft" });
  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "map-legend");
    div.innerHTML = `
      <div class="lg-row"><span class="lg-swatch lg-dep"></span>Departure</div>
      <div class="lg-row"><span class="lg-swatch lg-nav"></span>Navaid station</div>
      <div class="lg-row"><span class="lg-swatch lg-fix">1</span>Fix (in order flown)</div>
      <div class="lg-row"><span class="lg-line lg-intercept"></span>Intercepting course</div>
      <div class="lg-row"><span class="lg-line lg-track"></span>Established / holding</div>
      <div class="lg-row"><span class="lg-line lg-area"></span>Training area</div>`;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  legend.addTo(map);
}

/* ============================================================
 * export.js — KML / GPX export, built from the exact same
 * geometry as the map (geometry.js), so the exported file
 * always matches what's shown on screen.
 * ============================================================ */

function escapeXml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function kmlCoord(ll) { return `${ll.lon.toFixed(6)},${ll.lat.toFixed(6)},0`; }

function downloadText(filename, mime, text) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function buildKML(profile) {
  const geo = computeProfileGeometry(profile);
  const placemarks = [];
  const lines = [];

  placemarks.push(kmlPoint(`${profile.departure.icao} (T/O)`, "Departure / takeoff point", geo.origin));

  const drawnStations = new Set();
  function stationPlacemark(xy, navaid) {
    const key = (navaid.id || "") + navaid.type + navaid.freq;
    if (drawnStations.has(key)) return;
    drawnStations.add(key);
    const ll = geo.toLL(xy);
    placemarks.push(kmlPoint(navaid.id || navaid.type, `${navaid.type}${navaid.freq ? " " + navaid.freq : ""}${navaid.chan ? " / " + navaid.chan : ""}`, ll));
  }

  geo.legs.forEach((L, i) => {
    stationPlacemark(L.stationXY, L.leg.station);
    const fromLL = geo.toLL(L.fromXY), interceptLL = geo.toLL(L.interceptXY), fixLL = geo.toLL(L.fixXY);
    if (L.leg.kind === "fixToFix") {
      lines.push(kmlLine(`Leg ${i + 1} — direct ${pad3(L.leg.directCourse)}°/${L.leg.directDistNm}NM`, "trackStyle", [fromLL, fixLL]));
    } else if (L.leg.kind === "dmeArc") {
      lines.push(kmlLine(`Leg ${i + 1} — intercept`, "interceptStyle", [fromLL, interceptLL]));
      lines.push(kmlLine(`Leg ${i + 1} — ${L.leg.dme}DME arc R${pad3(L.leg.course)} to R${pad3(L.leg.exitRadial)}`, "trackStyle", L.arcPts.map(geo.toLL)));
    } else if (L.leg.kind === "hold") {
      lines.push(kmlLine(`Leg ${i + 1} — direct ${pad3(L.leg.directCourse)}°/${L.leg.directDistNm}NM to hold fix`, "trackStyle", [fromLL, fixLL]));
      lines.push(kmlLine(`Leg ${i + 1} — holding pattern`, "trackStyle", L.racetrack.loop.map(geo.toLL)));
      if (L.racetrack.kink) lines.push(kmlLine(`Leg ${i + 1} — hold entry`, "interceptStyle", L.racetrack.kink.map(geo.toLL)));
    } else {
      lines.push(kmlLine(`Leg ${i + 1} — intercept`, "interceptStyle", [fromLL, interceptLL]));
      lines.push(kmlLine(`Leg ${i + 1} — track ${pad3(L.leg.course)}°`, "trackStyle", [interceptLL, fixLL]));
    }
    const fixDesc = L.leg.kind === "hold"
      ? `Hold at ${L.leg.station.id || L.leg.station.type}, inbound ${pad3(L.leg.inboundCourse)}°, ${L.leg.turn} turns`
      : `R${pad3(L.leg.course)}°/${L.leg.dme}DME from ${L.leg.station.id || L.leg.station.type}`;
    placemarks.push(kmlPoint(`FIX ${i + 1}`, fixDesc, fixLL));
  });

  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
<name>${escapeXml("Sortie #" + profile.id + " - " + profile.departure.icao)}</name>
<Style id="trackStyle"><LineStyle><color>ff45250b</color><width>3</width></LineStyle></Style>
<Style id="interceptStyle"><LineStyle><color>ff1d27a5</color><width>2</width></LineStyle></Style>
${placemarks.join("\n")}
${lines.join("\n")}
</Document>
</kml>`;
  return kml;
}

function kmlPoint(name, desc, ll) {
  return `<Placemark><name>${escapeXml(name)}</name><description>${escapeXml(desc || "")}</description><Point><coordinates>${kmlCoord(ll)}</coordinates></Point></Placemark>`;
}
function kmlLine(name, styleId, llList) {
  return `<Placemark><name>${escapeXml(name)}</name><styleUrl>#${styleId}</styleUrl><LineString><tessellate>1</tessellate><coordinates>${llList.map(kmlCoord).join(" ")}</coordinates></LineString></Placemark>`;
}

function buildGPX(profile) {
  const geo = computeProfileGeometry(profile);
  const wpts = [];
  const rtepts = [];

  wpts.push(gpxWpt(geo.origin, `${profile.departure.icao}`, "Departure / takeoff"));
  rtepts.push(gpxRtept(geo.origin, "DEP"));

  const drawnStations = new Set();
  geo.legs.forEach((L, i) => {
    const key = (L.leg.station.id || "") + L.leg.station.type + L.leg.station.freq;
    if (!drawnStations.has(key)) {
      drawnStations.add(key);
      const ll = geo.toLL(L.stationXY);
      wpts.push(gpxWpt(ll, L.leg.station.id || L.leg.station.type, `${L.leg.station.type}${L.leg.station.freq ? " " + L.leg.station.freq : ""}`));
    }
    const fixLL = geo.toLL(L.fixXY);
    wpts.push(gpxWpt(fixLL, `FIX${i + 1}`, `R${pad3(L.leg.course)}°/${L.leg.dme}DME`));
    rtepts.push(gpxRtept(fixLL, `FIX${i + 1}`));
  });

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="INST Sortie Builder" xmlns="http://www.topografix.com/GPX/1/1">
${wpts.join("\n")}
<rte>
<name>${escapeXml("Sortie #" + profile.id + " - " + profile.departure.icao)}</name>
${rtepts.join("\n")}
</rte>
</gpx>`;
  return gpx;
}

function gpxWpt(ll, name, desc) {
  return `<wpt lat="${ll.lat.toFixed(6)}" lon="${ll.lon.toFixed(6)}"><name>${escapeXml(name)}</name><desc>${escapeXml(desc || "")}</desc></wpt>`;
}
function gpxRtept(ll, name) {
  return `<rtept lat="${ll.lat.toFixed(6)}" lon="${ll.lon.toFixed(6)}"><name>${escapeXml(name)}</name></rtept>`;
}

function exportProfileKML(profile) {
  downloadText(`sortie-${profile.id}-${profile.departure.icao}.kml`, "application/vnd.google-earth.kml+xml", buildKML(profile));
}
function exportProfileGPX(profile) {
  downloadText(`sortie-${profile.id}-${profile.departure.icao}.gpx`, "application/gpx+xml", buildGPX(profile));
}

/* ============================================================
 * app.js — UI wiring: GIS-style workspace, sortie tabs, live
 * map, detail panel, KML/GPX/print export.
 * ============================================================ */

const state = {
  difficulty: "easy",
  turnMode: "right",
  stationMode: "single",
  trainingAreas: ["area1"],
  profiles: [],
  currentIndex: -1,
  currentMap: null,
  mapRequestId: 0,
};

// Difficulty presets: a one-click starting point for the detailed controls below —
// the instructor can still hand-tune any field afterward, this just sets a sane
// combination instead of clicking through six controls individually every time.
const DIFFICULTY_PRESETS = {
  beginner:     { legs: 3, angle: 30, rounding: "easy",   fixToFix: 0, dmeArc: 0, turn: "right", standard: "faa" },
  intermediate: { legs: 4, angle: 45, rounding: "medium", fixToFix: 1, dmeArc: 0, turn: "right", standard: "faa" },
  hard:         { legs: 5, angle: 45, rounding: "hard",   fixToFix: 1, dmeArc: 1, turn: "mixed", standard: "icao" },
  hardest:      { legs: 6, angle: 60, rounding: "hard",   fixToFix: 2, dmeArc: 2, turn: "mixed", standard: "both" },
};

function applyDifficultyPreset(level) {
  const preset = DIFFICULTY_PRESETS[level];
  if (!preset) return;
  document.getElementById("numLegs").value = preset.legs;
  document.getElementById("selAngle").value = preset.angle;
  document.getElementById("selRounding").value = preset.rounding;
  document.getElementById("numFixToFix").value = preset.fixToFix;
  document.getElementById("numDmeArc").value = preset.dmeArc;
  document.getElementById("selTurn").value = preset.turn;
  document.getElementById("selStandard").value = preset.standard;
  state.difficulty = preset.rounding;
  state.turnMode = preset.turn;
  syncSidebar();
}

function turnLabel(t) { return t === "right" ? "Right (standard)" : "Left (non-standard)"; }

function entryLabel(entry, standard) {
  if (standard === "both") return `${ENTRY_LABEL.faa[entry.key]} <span class="note">(ICAO: ${ENTRY_LABEL.icao[entry.key]})</span>`;
  return ENTRY_LABEL[standard][entry.key];
}

const AIRPORT_SHORT_NAME = {
  VTBL: "Lop Buri",
  VTPI: "Takhli",
  VTPP: "Phitsanulok",
  VTCC: "Chiang Mai",
  VTUN: "Korat",
  VTUU: "Ubon Ratchathani",
  VTBK: "Kamphaeng Saen",
  VTBD: "Don Mueang",
};

function initAirportSelects() {
  [document.getElementById("selDeparture"), document.getElementById("selSecond")].forEach((sel) => {
    AIRPORT_LIST.forEach((icao) => {
      const a = AIRPORTS[icao];
      const o = document.createElement("option");
      o.value = icao;
      o.textContent = `${icao} — ${AIRPORT_SHORT_NAME[icao] || a.name}`;
      o.title = `${icao} — ${a.name}`;
      sel.appendChild(o);
    });
  });
  document.getElementById("selDeparture").value = "VTBL";
  document.getElementById("selSecond").value = AIRPORT_LIST[1];
}

function wireChipGroup(id, onPick) {
  const group = document.getElementById(id);
  group.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      group.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      onPick(chip.dataset.val);
    });
  });
}

// Multi-select chip group: any number of chips can be active at once (at least one).
function wireMultiChipGroup(id, onChange) {
  const group = document.getElementById(id);
  group.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const active = group.querySelectorAll(".chip.active");
      if (active.length === 1 && chip.classList.contains("active")) return; // keep at least one selected
      chip.classList.toggle("active");
      onChange(Array.from(group.querySelectorAll(".chip.active")).map((c) => c.dataset.val));
    });
  });
}

// Fill the Holding-reference selector from the chosen airport(s), keeping the
// current pick when it is still available, otherwise TACAN > VOR/DME > first.
function updateHoldRefOptions() {
  const sel = document.getElementById("selHoldRef");
  const options = holdRefOptions(document.getElementById("selDeparture").value, document.getElementById("selSecond").value, state.stationMode === "dual");
  const prev = sel.value;
  sel.innerHTML = "";
  options.forEach((o) => {
    const opt = document.createElement("option");
    opt.value = o.key;
    const n = o.navaid;
    opt.textContent = `${o.airport.icao} · ${n.id ? n.id + " " : ""}${n.type}${n.freq ? " " + n.freq : n.chan ? " " + n.chan : ""}`;
    sel.appendChild(opt);
  });
  const keep = options.find((o) => o.key === prev) || defaultHoldRef(options);
  if (keep) sel.value = keep.key;
}

function updateSecondAirportVisibility() {
  document.getElementById("fieldSecondAirport").style.display = state.stationMode === "dual" ? "" : "none";
  updateTrainingAreaVisibility();
}
function updateTrainingAreaVisibility() {
  const depIcao = document.getElementById("selDeparture").value;
  const secondIcao = document.getElementById("selSecond").value;
  const hasArea = !!(AIRPORTS[depIcao] && AIRPORTS[depIcao].trainingArea) ||
    (state.stationMode === "dual" && AIRPORTS[secondIcao] && AIRPORTS[secondIcao].trainingArea);
  document.getElementById("fieldTrainingArea").style.display = hasArea ? "" : "none";
}

function readConfig() {
  return {
    departureIcao: document.getElementById("selDeparture").value,
    stationMode: state.stationMode,
    fixToFixCount: Math.max(0, parseInt(document.getElementById("numFixToFix").value, 10) || 0),
    dmeArcCount: Math.max(0, parseInt(document.getElementById("numDmeArc").value, 10) || 0),
    holdingLegCount: Math.max(0, parseInt(document.getElementById("numHoldingLegs").value, 10) || 0),
    secondIcao: document.getElementById("selSecond").value,
    legCount: Math.max(2, Math.min(10, parseInt(document.getElementById("numLegs").value, 10) || 4)),
    interceptAngle: parseInt(document.getElementById("selAngle").value, 10),
    difficulty: state.difficulty,
    turnMode: state.turnMode,
    trainingAreas: document.getElementById("fieldTrainingArea").style.display !== "none" ? state.trainingAreas : [],
    standard: document.getElementById("selStandard").value,
    ring: readRing(),
    holdRefKey: document.getElementById("selHoldRef").value,
  };
}

// 8-20 NM training ring around the departure airport (null when disabled).
function readRing() {
  if (!document.getElementById("chkRing").checked) return null;
  let lo = parseFloat(document.getElementById("numRingMin").value);
  let hi = parseFloat(document.getElementById("numRingMax").value);
  if (!isFinite(lo)) lo = 8;
  if (!isFinite(hi)) hi = 20;
  if (lo > hi) [lo, hi] = [hi, lo];
  return { minNm: Math.max(0, lo), maxNm: Math.max(hi, 1) };
}

/* ---------------- Text builders (English) ---------------- */

function legGivenText(L, i) {
  const st = L.station;
  const stLabel = `${st.id || st.type} ${st.type}${st.freq ? " " + st.freq : ""}`;
  if (L.kind === "fixToFix") {
    return `<b>Leg ${i + 1} (Fix-to-Fix):</b> FIX ${i + 1} is R${pad3(L.course)}°/${L.dme} DME from ${stLabel}. `
      + `From your current position, compute the direct course and distance to FIX ${i + 1} and fly it.`;
  }
  if (L.kind === "dmeArc") {
    return `<b>Leg ${i + 1} (DME Arc):</b> from your current position (${L.bearingFromStation.toFixed(0)}°/${L.distanceNm} NM from ${stLabel}), `
      + `intercept the <b>R-${pad3(L.course)}</b> radial and track it to <b>${L.dme} DME</b> from ${st.id || st.type}. `
      + `At ${L.dme} DME, turn <b>${L.turn.toUpperCase()}</b> onto the ${L.dme} DME arc and fly it to intercept <b>R-${pad3(L.exitRadial)}</b> — this is FIX ${i + 1}.`;
  }
  if (L.kind === "hold") {
    return `<b>Leg ${i + 1} (Holding):</b> FIX ${i + 1} is <b>R${pad3(L.course)}°/${L.dme} DME</b> from ${stLabel}. `
      + `From your current position (${L.bearingFromStation.toFixed(0)}°/${L.distanceNm} NM from ${st.id || st.type}), proceed direct to FIX ${i + 1} and hold on the `
      + `<b>R-${pad3(L.course)}</b> radial, <b>inbound to ${st.id || st.type}</b> (inbound course <b>${pad3(L.inboundCourse)}°</b>), ${L.turn.toUpperCase()} TURNS, 1 min legs.`;
  }
  return `<b>Leg ${i + 1}:</b> from your current position (${L.bearingFromStation.toFixed(0)}°/${L.distanceNm} NM from ${stLabel}), `
    + `intercept course <b>${pad3(L.course)}°</b> and track it to <b>${L.dme} DME</b> from ${st.id || st.type} — this is FIX ${i + 1}.`;
}


// Standard (FAA/ICAO) entry procedure text for the answer key.
function entryProcedure(L) {
  const toward = L.turn === "right" ? "left" : "right"; // against the pattern direction
  if (L.entry.key === "direct") {
    return `<b>Direct:</b> on reaching the fix, turn ${L.turn} to the outbound heading ${pad3(norm360(L.inboundCourse + 180))}° and fly the pattern.`;
  }
  if (L.entry.key === "parallel") {
    return `<b>Parallel:</b> at the fix turn to outbound heading ${pad3(norm360(L.inboundCourse + 180))}°, fly it for 1 min, turn ${toward} (toward the holding side) `
      + `to intercept the inbound course ${pad3(L.inboundCourse)}°, then return to the fix and turn ${L.turn} to follow the pattern.`;
  }
  const off = norm360(L.inboundCourse + 180 + (L.turn === "right" ? -30 : 30));
  return `<b>Teardrop / Offset:</b> at the fix turn to heading ${pad3(off)}° (30° off the outbound course, holding side), fly 1 min, `
    + `turn ${L.turn} to intercept the inbound course ${pad3(L.inboundCourse)}°, then proceed to the fix and fly the pattern.`;
}

function endingGivenText(profile) {
  return `<b>Ending:</b> sortie ends at FIX ${profile.legs.length} — report field in sight, rejoin the traffic pattern at ${profile.departure.icao}.`;
}

function buildScenarioHtml(profile) {
  const rwy = profile.departure.runways && profile.departure.runways[0];
  let html = `<p>Takeoff ${profile.departure.icao}${rwy ? " RWY " + rwy.id : ""}, climb and maintain ${profile.altitude} ft AGL.</p>`;
  profile.legs.forEach((L, i) => (html += `<p>${legGivenText(L, i)}</p>`));
  html += `<p>${endingGivenText(profile)}</p>`;
  return html;
}

function buildSetupHtml(profile) {
  const rows = [
    ["Departure", `${profile.departure.icao} — ${profile.departure.name}${profile.departure.runways && profile.departure.runways[0] ? " (RWY " + profile.departure.runways[0].id + ")" : ""}`],
    ["Altitude", `${profile.altitude} ft AGL`],
    ["Intercept angle used", `${profile.config.interceptAngle}°`],
  ];
  profile.legs.forEach((L, i) => {
    const st = L.station;
    rows.push([`Leg ${i + 1} station`, `${st.id || "-"} (${st.type}${st.freq ? ", " + st.freq : ""}${st.chan ? " / " + st.chan : ""}) — ${L.stationAirport.icao}`]);
    if (L.kind === "fixToFix") {
      rows.push([`Leg ${i + 1} type`, "Fix-to-Fix (direct)"]);
      rows.push([`Leg ${i + 1} FIX definition`, `R${pad3(L.course)}° / ${L.dme} NM from station`]);
    } else if (L.kind === "dmeArc") {
      rows.push([`Leg ${i + 1} type`, "DME Arc"]);
      rows.push([`Leg ${i + 1} entry radial / DME`, `R${pad3(L.course)}° / ${L.dme} NM`]);
      rows.push([`Leg ${i + 1} arc turn / exit radial`, `${L.turn === "right" ? "Right" : "Left"} / R${pad3(L.exitRadial)}°`]);
      rows.push([`Leg ${i + 1} start position`, `${L.bearingFromStation.toFixed(0)}° / ${L.distanceNm} NM from station`]);
    } else if (L.kind === "hold") {
      rows.push([`Leg ${i + 1} type`, "Holding"]);
      rows.push([`Leg ${i + 1} course / DME`, `${pad3(L.course)}° / ${L.dme} NM`]);
      rows.push([`Leg ${i + 1} start position`, `${L.bearingFromStation.toFixed(0)}° / ${L.distanceNm} NM from station`]);
      rows.push([`Leg ${i + 1} hold radial / inbound`, `R-${pad3(L.course)} / ${pad3(L.inboundCourse)}° (to ${L.station.id || L.station.type}) · ${turnLabel(L.turn)}`]);
    } else {
      rows.push([`Leg ${i + 1} course / DME`, `${pad3(L.course)}° / ${L.dme} NM`]);
      rows.push([`Leg ${i + 1} start position`, `${L.bearingFromStation.toFixed(0)}° / ${L.distanceNm} NM from station`]);
    }
  });
  return `<table>${rows.map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join("")}</table>`;
}

function buildAnswerHtml(profile) {
  let html = "";
  profile.legs.forEach((L, i) => {
    if (L.kind === "fixToFix") {
      html += `<div class="result">Leg ${i + 1}: fly direct <b>${pad3(L.directCourse)}°</b> for <b>${L.directDistNm} NM</b></div>`
        + `<p class="note">Direct course/distance computed from your position to FIX ${i + 1} (R${pad3(L.course)}°/${L.dme} DME from station).</p>`;
    } else if (L.kind === "dmeArc") {
      html += `<div class="result">Leg ${i + 1}: fly <b>${pad3(L.interceptHeading)}°</b> to intercept R-${pad3(L.course)}, then ${L.turn.toUpperCase()} turn onto the arc</div>`
        + `<p class="note">Aircraft is on the ${L.side} side of R-${pad3(L.course)} → turn ${L.side === "right" ? "left" : "right"}, ${L.interceptAngle}° off course to intercept. `
        + `At ${L.dme} DME, turn ${L.turn} and fly the ${L.dme} DME arc (~${L.sweepDeg}° of turn) to R-${pad3(L.exitRadial)}, rolling out on approximately ${pad3(L.headingAtFix)}°.</p>`;
    } else if (L.kind === "hold") {
      html += `<div class="result">Leg ${i + 1}: fly direct <b>${pad3(L.directCourse)}°</b> / ${L.directDistNm} NM to the hold fix</div>`
        + `<p class="note">Fix is R-${pad3(L.course)} / ${L.dme} DME of ${L.station.id || L.station.type}; hold inbound on that radial to the station.</p>`
        + `<div class="result">Holding entry: ${entryLabel(L.entry, profile.config.standard)}</div>`
        + `<p class="note">Arrival heading ${pad3(L.directCourse)}° is ${L.entry.delta}° (clockwise) from inbound course ${pad3(L.inboundCourse)}° `
        + `→ ${L.entry.key} sector for ${L.turn}-hand turns (margin ${L.marginToBoundary.toFixed(0)}°).</p>`
        + `<p class="note">${entryProcedure(L)}</p>`;
    } else {
      html += `<div class="result">Leg ${i + 1}: fly <b>${pad3(L.interceptHeading)}°</b> to intercept</div>`
        + `<p class="note">Aircraft is on the ${L.side} side of course ${pad3(L.course)}° → turn ${L.side === "right" ? "left" : "right"}, `
        + `${L.interceptAngle}° off course. Once established, track ${pad3(L.course)}° to ${L.dme} DME.</p>`;
    }
  });
  return html;
}

/* ---------------- Sortie tabs / map / detail panel ---------------- */

function renderSortieTabs() {
  const wrap = document.getElementById("sortieTabs");
  wrap.innerHTML = "";
  state.profiles.forEach((p, i) => {
    const tab = document.createElement("div");
    tab.className = "sortie-tab" + (i === state.currentIndex ? " active" : "");
    tab.textContent = `Sortie ${p.id} (${p.departure.icao})`;
    tab.addEventListener("click", () => selectProfile(i));
    wrap.appendChild(tab);
  });
}

async function selectProfile(idx) {
  state.currentIndex = idx;
  renderSortieTabs();

  const profile = state.profiles[idx];
  document.getElementById("mapEmptyHint").style.display = "none";
  document.getElementById("detailPanel").style.display = "";
  document.getElementById("detailToggle").style.display = "";
  document.getElementById("btnExportKML").disabled = false;
  document.getElementById("btnExportGPX").disabled = false;
  document.getElementById("btnPrint").disabled = false;

  document.getElementById("paneScenario").innerHTML = buildScenarioHtml(profile);
  document.getElementById("paneSetup").innerHTML = buildSetupHtml(profile);
  document.getElementById("paneAnswer").innerHTML = buildAnswerHtml(profile);

  if (state.currentMap) {
    state.currentMap.remove();
    state.currentMap = null;
  }
  const mapDiv = document.getElementById("mainMap");
  mapDiv.innerHTML = "";
  const requestId = ++state.mapRequestId;
  const map = await renderProfileMap(mapDiv, profile);
  if (requestId !== state.mapRequestId) { map.remove(); return; } // a newer selection started while we were loading
  state.currentMap = map;
  requestAnimationFrame(() => state.currentMap && state.currentMap.invalidateSize());
}

function wireDetailTabs() {
  document.querySelectorAll(".dtab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".dtab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll(".dpane").forEach((p) => (p.style.display = p.dataset.pane === tab.dataset.tab ? "" : "none"));
    });
  });
}


/* ---------------- Sidebar widgets ---------------- */
// Turn every select[data-seg] into a segmented control and every .stepper-in number
// input into a −/+ stepper. The original elements stay in the DOM (hidden / wrapped)
// as the single source of truth, so readConfig() and the presets keep working.
function enhanceSidebar() {
  document.querySelectorAll("select[data-seg]").forEach((sel) => {
    const seg = document.createElement("div");
    seg.className = "seg";
    Array.from(sel.options).forEach((o) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.val = o.value; b.textContent = o.textContent;
      b.addEventListener("click", () => {
        if (sel.value === o.value) return;
        sel.value = o.value;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
      });
      seg.appendChild(b);
    });
    sel.style.display = "none";
    sel.after(seg);
    sel._seg = seg;
  });
  document.querySelectorAll("input.stepper-in").forEach((inp) => {
    const wrap = document.createElement("div");
    wrap.className = "stepper";
    const mk = (txt, dir) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = txt; b.tabIndex = -1;
      b.addEventListener("click", () => {
        const step = parseFloat(inp.step) || 1;
        const min = inp.min === "" ? -Infinity : parseFloat(inp.min);
        const max = inp.max === "" ? Infinity : parseFloat(inp.max);
        const v = (parseFloat(inp.value) || 0) + dir * step;
        inp.value = Math.min(max, Math.max(min, v));
        inp.dispatchEvent(new Event("input", { bubbles: true }));
      });
      return b;
    };
    inp.before(wrap);
    wrap.append(mk("−", -1), inp, mk("+", 1));
  });
  ["numLegs", "numFixToFix", "numDmeArc", "numHoldingLegs"].forEach((id) =>
    document.getElementById(id).addEventListener("input", syncSidebar));
  document.querySelectorAll("select[data-seg]").forEach((s) => s.addEventListener("change", syncSidebar));
  document.getElementById("chkRing").addEventListener("change", syncSidebar);
  syncSidebar();
}

// Refresh the derived UI (segment highlights, intercept-leg count, ring fields).
function syncSidebar() {
  document.querySelectorAll("select[data-seg]").forEach((sel) => {
    sel._seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.val === sel.value));
  });
  const total = Math.max(2, Math.min(10, parseInt(document.getElementById("numLegs").value, 10) || 4));
  const special = ["numFixToFix", "numDmeArc", "numHoldingLegs"]
    .reduce((n, id) => n + Math.max(0, parseInt(document.getElementById(id).value, 10) || 0), 0);
  const note = document.getElementById("mixNote");
  const rest = total - special;
  note.classList.toggle("warn", rest < 0);
  note.innerHTML = rest < 0
    ? `Mix uses ${special} legs but total is ${total} — raise Total legs.`
    : `Remaining <b>${rest}</b> leg${rest === 1 ? "" : "s"} will be Intercept.`;
  document.getElementById("fieldHoldRef").style.display = (parseInt(document.getElementById("numHoldingLegs").value, 10) || 0) > 0 ? "" : "none";
  document.getElementById("ringFields").style.display = document.getElementById("chkRing").checked ? "" : "none";
}


function main() {
  initAirportSelects();
  enhanceSidebar();
  document.getElementById("selRounding").addEventListener("change", (e) => (state.difficulty = e.target.value));
  document.getElementById("selTurn").addEventListener("change", (e) => (state.turnMode = e.target.value));
  document.getElementById("chkTwoStations").addEventListener("change", (e) => {
    state.stationMode = e.target.checked ? "dual" : "single";
    updateSecondAirportVisibility();
    updateHoldRefOptions();
  });
  document.getElementById("selDifficultyLevel").addEventListener("change", (e) => applyDifficultyPreset(e.target.value));
  wireMultiChipGroup("chipTrainingArea", (vals) => (state.trainingAreas = vals));
  document.getElementById("selDeparture").addEventListener("change", () => { updateTrainingAreaVisibility(); updateHoldRefOptions(); });
  document.getElementById("selSecond").addEventListener("change", () => { updateTrainingAreaVisibility(); updateHoldRefOptions(); });
  updateSecondAirportVisibility();
  updateTrainingAreaVisibility();
  updateHoldRefOptions();
  wireDetailTabs();

  document.getElementById("btnGenerate").addEventListener("click", () => {
    const cfg = readConfig();
    const count = Math.max(1, Math.min(10, parseInt(document.getElementById("numCount").value, 10) || 1));
    state.profiles = generateProfiles(cfg, count);
    selectProfile(0);
  });

  document.getElementById("btnExportKML").addEventListener("click", () => {
    if (state.currentIndex >= 0) exportProfileKML(state.profiles[state.currentIndex]);
  });
  document.getElementById("btnExportGPX").addEventListener("click", () => {
    if (state.currentIndex >= 0) exportProfileGPX(state.profiles[state.currentIndex]);
  });
  document.getElementById("btnPrint").addEventListener("click", () => {
    const includeAnswers = document.getElementById("chkShowAnswers").checked;
    document.getElementById("paneAnswer").classList.toggle("print-hide", !includeAnswers);
    window.print();
  });

  window.addEventListener("resize", () => { if (state.currentMap) state.currentMap.invalidateSize(); });

  document.getElementById("sidebarToggle").addEventListener("click", () => {
    document.getElementById("layoutRoot").classList.toggle("collapsed");
    setTimeout(() => state.currentMap && state.currentMap.invalidateSize(), 220);
  });

  document.querySelectorAll(".side-section-head").forEach((head) => {
    head.addEventListener("click", () => {
      const section = head.parentElement;
      const open = section.dataset.open !== "false";
      section.dataset.open = open ? "false" : "true";
    });
  });

  document.getElementById("detailToggle").addEventListener("click", () => {
    document.getElementById("gisWorkspace").classList.toggle("detail-collapsed");
    setTimeout(() => state.currentMap && state.currentMap.invalidateSize(), 220);
  });
}

document.addEventListener("DOMContentLoaded", main);
</script>
