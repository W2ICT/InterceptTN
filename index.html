<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFR Sortie Builder — GIS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root {
  --bg: #10141d;
  --panel: #171c27;
  --panel-2: #1f2634;
  --panel-3: #262f40;
  --line: #2a3244;
  --ink: #eef1f6;
  --muted: #8b96a8;
  --accent: #d6a13c;
  --teal: #3ecfab;
  --danger: #e2564b;
  --good: #34c98d;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 14px rgba(0, 0, 0, .3);
  --shadow-lg: 0 12px 34px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
  -webkit-font-smoothing: antialiased;
}

/* Friendlier thin scrollbars everywhere in the app */
.panel-scroll, .detail-body {
  scrollbar-width: thin;
  scrollbar-color: var(--panel-3) transparent;
}
.panel-scroll::-webkit-scrollbar, .detail-body::-webkit-scrollbar { width: 8px; }
.panel-scroll::-webkit-scrollbar-track, .detail-body::-webkit-scrollbar-track { background: transparent; }
.panel-scroll::-webkit-scrollbar-thumb, .detail-body::-webkit-scrollbar-thumb {
  background: var(--panel-3); border-radius: 8px; border: 2px solid var(--panel);
}
.panel-scroll::-webkit-scrollbar-thumb:hover, .detail-body::-webkit-scrollbar-thumb:hover { background: #33405a; }

/* ---------------- Header ---------------- */
header.app-header {
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding: 12px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  font-size: 18px; color: #06251d; background: var(--teal);
  width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none;
}
header.app-header h1 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: .1px; color: var(--ink); }
header.app-header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--panel-2);
  color: var(--ink); font-size: 15px; cursor: pointer; transition: all .15s ease;
}
.icon-btn:hover { border-color: var(--teal); background: var(--panel-3); }

/* ---------------- Toolbar row ---------------- */
.toolbar-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--bg);
}
.sortie-tabs { display: flex; gap: 8px; flex-wrap: wrap; min-height: 30px; align-items: center; }
.sortie-tabs:empty::before { content: "No sorties generated yet"; font-size: 12.5px; color: var(--muted); }
.sortie-tab {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 7px 16px;
  font-size: 12.5px; cursor: pointer; font-weight: 600; color: var(--muted); transition: all .15s ease;
}
.sortie-tab:hover { border-color: var(--teal); color: var(--ink); }
.sortie-tab.active { background: var(--teal); color: #06251d; border-color: var(--teal); }
.toolbar-actions { display: flex; gap: 8px; }
button.tool-pill {
  padding: 8px 15px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 999px; font-size: 12.5px; cursor: pointer; font-weight: 600; transition: all .15s ease;
}
button.tool-pill:disabled { opacity: .35; cursor: not-allowed; }
button.tool-pill:not(:disabled):hover { border-color: var(--teal); color: var(--teal); background: var(--panel-3); }

/* ---------------- Layout ---------------- */
.layout {
  display: flex;
  position: relative;
  height: calc(100vh - 58px - 51px);
  padding: 0 12px 12px;
  gap: 0;
}
@media (max-width: 860px) {
  .layout { height: auto; flex-direction: column; }
  .sidebar-toggle { display: none; }
}

/* ---------------- Sidebar ---------------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  width: 300px;
  flex: 0 0 300px;
  overflow: hidden;
  transition: width .2s ease, flex-basis .2s ease, opacity .15s ease;
}
.panel-scroll { height: 100%; overflow-y: auto; padding: 6px; }
.layout.collapsed .panel { width: 0; flex-basis: 0; opacity: 0; pointer-events: none; border: none; }

.sidebar-toggle {
  flex: 0 0 auto;
  width: 20px;
  align-self: center;
  height: 56px;
  margin: 0 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel-2);
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  transition: transform .2s ease, color .15s ease;
}
.sidebar-toggle:hover { color: var(--teal); border-color: var(--teal); }
.layout.collapsed .sidebar-toggle { transform: rotate(180deg); }

.side-section {
  background: var(--panel-2);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin-bottom: 6px;
}
.side-section:last-child { margin-bottom: 0; }
.side-section-head {
  font-size: 12px; font-weight: 700; color: var(--ink);
  cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
  margin: -1px -1px 5px;
}
.side-section[data-open="true"] .side-section-head { margin-bottom: 7px; }
.side-section-head .chev { font-size: 9px; transition: transform .15s ease; color: var(--teal); }
.side-section[data-open="false"] .chev { transform: rotate(-90deg); }
.side-section[data-open="false"] .side-section-head { margin-bottom: 0; }
.side-section[data-open="false"] .side-section-body { display: none; }

.field { margin-bottom: 7px; }
.field:last-child { margin-bottom: 0; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 7px; }
.field-row .field { margin-bottom: 0; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
.field select, .field input[type=number] {
  width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 12.5px;
  background: var(--panel); color: var(--ink);
  text-overflow: ellipsis;
}
.field select:focus, .field input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(62, 207, 171, .15); }
.chip-group { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px;
  font-size: 11.5px; cursor: pointer; user-select: none; color: var(--ink); transition: all .15s ease;
}
.chip:hover { border-color: var(--teal); }
.chip.active { background: var(--teal); color: #06251d; border-color: var(--teal); font-weight: 600; }
.chip-sm { gap: 4px; }
.chip-sm .chip { padding: 4px 9px; font-size: 10.5px; }
.check-row { display: flex; align-items: flex-start; gap: 7px; font-size: 11.5px; color: var(--muted); margin-top: 5px; cursor: pointer; line-height: 1.35; }
.check-row input { margin-top: 2px; accent-color: var(--teal); }
.check-row-tight { margin-top: 2px; margin-bottom: 8px; }

button.primary {
  width: 100%; padding: 10px; background: var(--accent); color: #241700; font-weight: 700;
  border: none; border-radius: var(--radius-sm); font-size: 13.5px; cursor: pointer; letter-spacing: .1px; margin-bottom: 9px;
  box-shadow: 0 4px 16px rgba(214, 161, 60, .25); transition: filter .15s ease, transform .1s ease;
}
button.primary:hover { filter: brightness(1.07); }
button.primary:active { transform: translateY(1px); }

/* ---------------- GIS workspace ---------------- */
.gis-workspace { flex: 1 1 auto; display: flex; flex-direction: row; gap: 0; min-width: 0; margin-left: 8px; min-height: 0; }

.map-area {
  position: relative;
  flex: 1 1 auto;
  min-height: 260px;
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
#mainMap { width: 100%; height: 100%; background: var(--bg); }
.map-area .empty-hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 14.5px; text-align: center; padding: 0 40px; z-index: 500; background: var(--panel);
}

/* Right-hand collapsible brief dock */
.detail-toggle {
  flex: 0 0 auto;
  width: 20px;
  align-self: center;
  height: 56px;
  margin: 0 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel-2);
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  transition: transform .2s ease, color .15s ease;
}
.detail-toggle:hover { color: var(--teal); border-color: var(--teal); }
.gis-workspace.detail-collapsed .detail-toggle { transform: rotate(180deg); }

.detail-panel {
  flex: 0 0 380px;
  width: 380px;
  height: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  display: flex; flex-direction: column;
  transition: width .2s ease, flex-basis .2s ease, opacity .15s ease;
}
.gis-workspace.detail-collapsed .detail-panel { width: 0; flex-basis: 0; opacity: 0; pointer-events: none; border: none; }
@media (max-width: 860px) {
  .gis-workspace { flex-direction: column; gap: 10px; }
  .detail-toggle { display: none; }
  .detail-panel { width: 100%; flex-basis: auto; max-height: 40%; }
}
.detail-tabs { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); flex: 0 0 auto; padding: 8px 10px 0; overflow-x: auto; }
.dtab { padding: 9px 14px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; transition: color .15s ease; }
.dtab:hover { color: var(--ink); }
.dtab.active { color: var(--teal); background: var(--panel-2); }
.detail-body { padding: 16px 20px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.dpane p { margin: 6px 0; font-size: 13.5px; line-height: 1.65; color: var(--ink); }
.dpane b { color: #fff; }
.dpane table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dpane td { padding: 6px 4px; border-bottom: 1px solid var(--line); color: var(--ink); }
.dpane td.k { color: var(--muted); width: 40%; }
.dpane .result { font-weight: 700; color: var(--teal); font-size: 14px; margin: 12px 0 3px; }
.dpane .note { font-size: 12.5px; color: var(--muted); }

/* Leaflet marker pins */
.pin { border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px rgba(255,255,255,.6); font-weight: 700; color: #fff; }
.pin-nav { width: 13px; height: 13px; background: #3b82f6; border-radius: 3px; }
.pin-fix { width: 22px; height: 22px; background: #1d4f91; font-size: 11.5px; }
.pin-hold { width: 22px; height: 22px; background: #6b3fa0; font-size: 12px; }
.pin-dep { width: 24px; height: 24px; background: var(--good); font-size: 13px; }
.leaflet-tooltip { font-size: 12px; background: rgba(23,28,39,.94); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
.leaflet-tooltip::before { display: none; }

/* Map legend */
.map-legend {
  background: rgba(23,28,39,.92); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 11.5px; color: var(--ink); box-shadow: var(--shadow); line-height: 1.9;
}
.lg-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.lg-swatch { display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 700; }
.lg-dep { width: 14px; height: 14px; background: var(--good); }
.lg-nav { width: 10px; height: 10px; background: #3b82f6; border-radius: 3px; }
.lg-fix { width: 14px; height: 14px; background: #1d4f91; }
.lg-line { display: inline-block; width: 22px; height: 0; border-top-width: 3px; border-top-style: solid; flex: none; }
.lg-intercept { border-color: #e0a02c; border-top-style: dashed; }
.lg-track { border-color: #1d4f91; }
.lg-area { border-color: #8b96a8; border-top-style: dashed; border-top-width: 1.5px; }

.empty-hint { color: var(--muted); font-size: 14.5px; padding: 40px 10px; text-align: center; line-height: 1.6; }

/* ---------------- Print — two landscape pages: page 1 is the profile view
   (map + scenario side by side), page 2 is the detail (setup + answer key,
   full width). detail-panel/detail-body are unwrapped with display:contents
   so their dpane children lay out directly in .gis-workspace's float flow —
   otherwise setup/answer would be stuck inside the narrow scenario column. */
@media print {
  @page { size: landscape; margin: 9mm; }
  header.app-header, .panel, .sidebar-toggle, .toolbar-row, .icon-btn, .detail-toggle { display: none !important; }
  body { background: #fff; color: #000; font-size: 9.5px; }
  .layout { display: block; padding: 0; height: auto; }
  .gis-workspace { display: block !important; margin-left: 0 !important; }

  .map-area { float: left; width: 46%; margin-right: 2%; height: 178mm; border: none; page-break-inside: avoid; }
  .detail-panel, .detail-body { display: contents !important; }
  .detail-tabs { display: none; }
  .dpane { display: none !important; }

  .dpane[data-pane="scenario"] {
    display: block !important; float: right; width: 50%; padding: 2mm 0;
    font-size: 9.5px; line-height: 1.55;
  }
  .dpane[data-pane="setup"], .dpane[data-pane="answer"] {
    display: block !important; clear: both; width: 100%;
    column-count: 2; column-gap: 16px; font-size: 9px; line-height: 1.35;
  }
  .dpane[data-pane="setup"] { page-break-before: always; padding-top: 2mm; }

  .dpane.print-hide { display: none !important; }
  .dpane p, .dpane td, .dpane b { color: #000; margin: 3px 0; }
  .dpane .result { font-size: 9.5px; margin: 6px 0 2px; break-inside: avoid-column; }
  .dpane .note { font-size: 8px; }
  .dpane table { font-size: 8.5px; width: 100%; }
  .dpane td { padding: 2px 3px; }
}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="brand-mark">✈</span>
    <div>
      <h1>IFR Sortie Builder</h1>
      <p>Intercept &amp; Holding trainer · real navaid data · KML/GPX export</p>
    </div>
  </div>
  <div class="header-actions">
    <div class="toolbar-actions">
      <button class="tool-pill" id="btnExportKML" disabled>⤓ KML</button>
      <button class="tool-pill" id="btnExportGPX" disabled>⤓ GPX</button>
      <button class="tool-pill" id="btnPrint" disabled>🖶 Print / PDF</button>
    </div>
  </div>
</header>

<div class="toolbar-row">
  <div class="sortie-tabs" id="sortieTabs"></div>
</div>

<div class="layout" id="layoutRoot">
  <aside class="panel" id="controlPanel">
    <div class="panel-scroll">

      <div class="side-section" data-open="true">
        <div class="side-section-head"><span class="chev">▾</span> 🎚 Difficulty</div>
        <div class="side-section-body">
          <div class="field">
            <label>Challenge level — sets legs, angle, rounding, leg mix &amp; turn below</label>
            <select id="selDifficultyLevel">
              <option value="beginner" selected>Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="hard">Hard</option>
              <option value="hardest">Hardest</option>
            </select>
          </div>
        </div>
      </div>

      <div class="side-section" data-open="true">
        <div class="side-section-head"><span class="chev">▾</span> 🧭 Route</div>
        <div class="side-section-body">
          <div class="field">
            <label>Departure airport</label>
            <select id="selDeparture"></select>
          </div>
          <label class="check-row check-row-tight">
            <input type="checkbox" id="chkTwoStations">
            <span>Use a second station for legs</span>
          </label>
          <div class="field" id="fieldSecondAirport" style="display:none;">
            <select id="selSecond"></select>
          </div>
          <div class="field-row field-row-3">
            <div class="field">
              <label>Fix-to-Fix legs</label>
              <input type="number" id="numFixToFix" min="0" max="10" value="0">
            </div>
            <div class="field">
              <label>DME Arc legs</label>
              <input type="number" id="numDmeArc" min="0" max="10" value="0">
            </div>
            <div class="field">
              <label>Holding legs</label>
              <input type="number" id="numHoldingLegs" min="0" max="10" value="0">
            </div>
          </div>
          <div class="field" id="fieldTrainingArea" style="display:none;">
            <label>Training area(s) — tap to add/remove</label>
            <div class="chip-group chip-sm" id="chipTrainingArea">
              <div class="chip active" data-val="area1">Area 1</div>
              <div class="chip" data-val="area2">Area 2</div>
              <div class="chip" data-val="area3">Area 3</div>
            </div>
          </div>
          <div class="field-row field-row-3">
            <div class="field">
              <label>Legs</label>
              <input type="number" id="numLegs" min="2" max="10" value="4">
            </div>
            <div class="field">
              <label>Angle</label>
              <select id="selAngle">
                <option value="30">30°</option>
                <option value="45" selected>45°</option>
                <option value="60">60°</option>
              </select>
            </div>
            <div class="field">
              <label>Rounding</label>
              <select id="selRounding">
                <option value="easy">30°</option>
                <option value="medium">10°</option>
                <option value="hard">1°</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Turn (for Holding legs)</label>
              <select id="selTurn">
                <option value="right">Standard (R)</option>
                <option value="mixed">Random</option>
                <option value="left">Non-std (L)</option>
              </select>
            </div>
            <div class="field">
              <label>Terminology</label>
              <select id="selStandard">
                <option value="faa">FAA</option>
                <option value="icao">ICAO</option>
                <option value="both">Both</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="side-section" data-open="true">
        <div class="side-section-head"><span class="chev">▾</span> ✨ Generate</div>
        <div class="side-section-body">
          <div class="field">
            <label>Number of sorties</label>
            <input type="number" id="numCount" min="1" max="10" value="1">
          </div>
          <button class="primary" id="btnGenerate">Generate sortie(s)</button>
          <label class="check-row">
            <input type="checkbox" id="chkShowAnswers" checked>
            <span>Include answer key in PDF export</span>
          </label>
        </div>
      </div>

    </div>
  </aside>

  <button class="sidebar-toggle" id="sidebarToggle" title="Show/hide panel">‹</button>

  <div class="gis-workspace" id="gisWorkspace">
    <div id="mapArea" class="map-area">
      <div class="empty-hint" id="mapEmptyHint">No sortie yet — set your options and click <b>Generate sortie(s)</b>.</div>
      <div id="mainMap"></div>
    </div>

    <button class="detail-toggle" id="detailToggle" title="Show/hide brief" style="display:none;">›</button>

    <div class="detail-panel" id="detailPanel" style="display:none;">
      <div class="detail-tabs">
        <div class="dtab active" data-tab="scenario">Scenario</div>
        <div class="dtab" data-tab="setup">Setup</div>
        <div class="dtab" data-tab="answer">Answer key</div>
      </div>
      <div class="detail-body" id="detailBody">
        <div class="dpane" data-pane="scenario" id="paneScenario"></div>
        <div class="dpane" data-pane="setup" id="paneSetup" style="display:none;"></div>
        <div class="dpane" data-pane="answer" id="paneAnswer" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ============================================================
 * config.js — no configuration needed; the app uses Esri's free
 * satellite basemap (no API key or billing account required).
 * ============================================================ */

/* ============================================================
 * data.js — Navaid database, real published data extracted from
 * the Thailand AIP (CAAT eAIP, aip.caat.or.th, AIRAC cycle
 * 2024-09-05 for the military fields, various cycles for the
 * civil fields as indexed). AD 2.19 "RADIO NAVIGATION AND
 * LANDING AIDS" tables, cross-checked against AD 2.2 ARP
 * coordinates. Coordinates are stored as the raw AIP string
 * (DMS) plus a parsed decimal value for schematic plotting.
 * This is a TRAINING tool — diagrams are schematic, not to
 * scale for real navigation. Always verify against the current
 * AIP / NOTAMs before real-world use.
 * ============================================================ */

// Parse a coordinate token like "184617N", "135451.74N", "1846.2N" (lat)
// or "0985746E", "1003620.49E", "9858.2E" (lon) into decimal degrees.
function parseCoord(token) {
  const hemi = token.slice(-1);
  const digits = token.slice(0, -1);
  const sign = (hemi === "S" || hemi === "W") ? -1 : 1;
  const isLat = (hemi === "N" || hemi === "S");
  const intLen = isLat ? 2 : 3; // degrees digits before minutes
  const degStr = digits.slice(0, intLen);
  const rest = digits.slice(intLen);
  let deg = parseFloat(degStr || "0");
  let minutes = 0;
  if (rest.length <= 2) {
    // DD MM (no seconds) e.g. leftover "46" -> minutes only, rare
    minutes = parseFloat(rest || "0");
  } else if (rest.indexOf(".") !== -1 && rest.indexOf(".") <= 2) {
    // DD MM.m form e.g. "46.2" -> minutes.minutes
    minutes = parseFloat(rest);
  } else {
    // DD MM SS(.ss) form e.g. "1738" or "1738.35"
    const mm = rest.slice(0, 2);
    const ss = rest.slice(2);
    minutes = parseFloat(mm || "0") + parseFloat(ss || "0") / 60;
  }
  return sign * (deg + minutes / 60);
}

function coord(latToken, lonToken) {
  return {
    raw: `${latToken} ${lonToken}`,
    lat: parseCoord(latToken),
    lon: parseCoord(lonToken),
  };
}
